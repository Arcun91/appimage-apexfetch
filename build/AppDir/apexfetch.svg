<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#1a1c29"/>
    </linearGradient>
    <linearGradient id="apexGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#9b51e0"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bg)" stroke="#2b2d42" stroke-width="3"/>

  <!-- Outer Apex Chevron Glow & Stroke -->
  <path d="M 128 44 L 210 196 L 176 196 L 128 106 L 80 196 L 46 196 Z" 
        fill="url(#apexGrad)" filter="url(#glow)" opacity="0.4"/>
  <path d="M 128 44 L 210 196 L 176 196 L 128 106 L 80 196 L 46 196 Z" 
        fill="url(#apexGrad)"/>

  <!-- Inner Core Chevron -->
  <path d="M 128 126 L 158 184 L 138 184 L 128 164 L 118 184 L 98 184 Z" 
        fill="url(#coreGrad)"/>

  <!-- Terminal Dot Accent -->
  <circle cx="128" cy="214" r="6" fill="#00f2fe" filter="url(#glow)"/>
</svg>
